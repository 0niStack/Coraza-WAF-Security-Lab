# 01 - Traefik + OWASP Coraza WAF (Traefik plugin, WASM)
# Start this FIRST: it creates the shared network "waf-net".
services:
  traefik:
    image: traefik:v3.6.1
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"   # dashboard (lab only)
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - waf-net

networks:
  waf-net:
    name: waf-net
